<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>
  
  <!-- Background Badge com bordas arredondadas -->
  <rect x="2" y="2" width="96" height="96" rx="22" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="3"/>
  
  <!-- Escudo Institucional -->
  <path d="M50 14 L78 24 C78 52 50 76 50 76 C50 76 22 52 22 24 Z" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linejoin="round"/>
  
  <!-- Detalhe interno do escudo verde esmeralda -->
  <path d="M50 20 L72 28 C72 50 50 70 50 70 C50 70 28 50 28 28 Z" fill="#047857" opacity="0.35"/>
  
  <!-- Caixa isométrica de inventário patrimonial -->
  <!-- Topo -->
  <polygon points="50,42 66,33 50,24 34,33" fill="#fbbf24" stroke="#d97706" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Lado Esquerdo -->
  <polygon points="34,33 50,42 50,60 34,51" fill="#d97706" stroke="#b45309" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Lado Direito -->
  <polygon points="50,42 66,33 66,51 50,60" fill="#f59e0b" stroke="#d97706" stroke-width="1.5" stroke-linejoin="round"/>
  
  <!-- Fita e Detalhe de Checklist -->
  <polyline points="40,30 46,37 60,25" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Texto SENAPPEN pequeno na base -->
  <text x="50" y="89" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1">SENAPPEN</text>
</svg>
