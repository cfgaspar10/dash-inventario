  /**
   * Cliente de Comunicação Universal (Apps Script Runner ou HTTP API REST para Vercel)
   */
  const ApiClient = {
    executar: function(action, payload = {}) {
      return new Promise((resolve, reject) => {
        // 1. Google Apps Script nativo
        if (typeof google !== 'undefined' && google.script && google.script.run) {
          const runner = google.script.run
            .withSuccessHandler(resolve)
            .withFailureHandler(reject);

          switch (action) {
            case 'autenticar':
              runner.autenticarUsuario(payload.login, payload.senha);
              break;
            case 'listarUsuarios':
              runner.listarUsuarios();
              break;
            case 'salvarUsuario':
              runner.salvarUsuario(payload.usuario);
              break;
            case 'excluirUsuario':
              runner.excluirUsuario(payload.id);
              break;
            case 'alterarSenhaUsuario':
              runner.alterarSenhaUsuario(payload.id, payload.novaSenha);
              break;
            case 'salvarUorg':
              runner.salvarUorg(payload.uorg || payload);
              break;
            case 'cadastrarUorg':
              runner.cadastrarUorg(payload.uorg || payload);
              break;
            case 'excluirUorg':
              runner.excluirUorg(payload.id);
              break;
            case 'toggleUorg':
              runner.toggleUorg(payload.id, payload.ativo);
              break;
            case 'salvarUg':
              runner.salvarUg(payload.ug || payload);
              break;
            case 'excluirUg':
              runner.excluirUg(payload.siglaOuId || payload.sigla);
              break;
            case 'restaurarUgsPadrao':
              runner.restaurarUgsPadrao();
              break;
            case 'salvarParametrosCiclo':
              runner.salvarParametrosCiclo(payload.ciclo || payload);
              break;
            case 'ativarCiclo':
              runner.ativarCiclo(payload.idOuAno || payload.ano);
              break;
            case 'excluirCiclo':
              runner.excluirCiclo(payload.idOuAno || payload.ano);
              break;
            case 'salvarEtapaCronograma':
              runner.salvarEtapaCronograma(payload.etapa || payload);
              break;
            case 'excluirEtapaCronograma':
              runner.excluirEtapaCronograma(payload.id);
              break;
            case 'obterDadosCompletos':
              runner.obterDadosCompletos();
              break;
            default:
              resolve({ status: 'warning', mensagem: 'Ação não mapeada no GAS runner: ' + action });
          }
          return;
        }

        // 2. Chamada HTTP (Vercel Serverless Gateway /api/gateway ou direta)
        const endpoint = (window.location.hostname === 'localhost' || window.location.hostname.includes('vercel.app'))
          ? '/api/gateway'
          : GAS_WEBAPP_URL;

        fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: action, ...payload })
        })
        .then(r => r.json())
        .then(data => resolve(data))
        .catch(err => {
          console.warn(`[ApiClient] Requisição HTTP para ${action} caiu no fallback:`, err);
          // Fallback seguro em caso de indisponibilidade de rede ou deploy local inicial
          if (action === 'autenticar') {
            if (payload.login === 'admin' && payload.senha === 'admin@senappen2026') {
              resolve({
                status: 'success',
                mensagem: 'Autenticado com sucesso!',
                usuario: {
                  id_usuario: 1,
                  login: 'admin',
                  nome: 'Administrador Geral',
                  email: 'admin.inventario@mj.gov.br',
                  perfil: 'ADMIN',
                  ug_vinculada: 'TODAS',
                  ativo: 'S'
                }
              });
            } else {
              resolve({ status: 'error', mensagem: 'Usuário ou senha incorretos.' });
            }
          } else if (action === 'listarUsuarios') {
            resolve({
              status: 'success',
              dados: state.usuarios.length > 0 ? state.usuarios : [
                {
                  id_usuario: 1,
                  login: 'admin',
                  nome: 'Administrador Geral',
                  email: 'admin.inventario@mj.gov.br',
                  perfil: 'ADMIN',
                  ug_vinculada: 'TODAS',
                  ativo: 'S',
                  data_criacao: '2026-01-15'
                }
              ]
            });
          } else {
            reject(err);
          }
        });
      });
    }
  };

  // AUTENTICAÇÃO E SESSÃO DO USUÁRIO (LOGIN / LOGOUT / RBAC)
  // ============================================================================

  function verificarSessaoUsuario() {
    try {
      const sessaoRaw = sessionStorage.getItem(SESSION_KEY);
      if (sessaoRaw) {
        const usuario = JSON.parse(sessaoRaw);
        if (usuario && usuario.login) {
          state.usuarioLogado = usuario;
          aplicarUsuarioLogado();
          return true;
        }
      }
    } catch (e) {
      console.warn('Erro ao ler sessão do usuário:', e);
    }
    exibirTelaLogin();
    return false;
  }

  function exibirTelaLogin() {
    if (elements.viewLogin) elements.viewLogin.style.display = 'flex';
    if (elements.appContainer) elements.appContainer.style.display = 'none';
  }

  function aplicarUsuarioLogado() {
    const user = state.usuarioLogado;
    if (!user) return;

    if (elements.viewLogin) elements.viewLogin.style.display = 'none';
    if (elements.appContainer) elements.appContainer.style.display = 'block';

    // Preenche a barra do usuário logado
    if (elements.headerUserBadge) {
      elements.headerUserBadge.style.display = 'flex';
      if (elements.headerUserName) {
        elements.headerUserName.textContent = user.nome || user.login;
        elements.headerUserName.title = `${user.nome} (${user.email || user.login})`;
      }

      // Iniciais para o avatar circular
      if (elements.headerUserAvatar) {
        const partes = (user.nome || user.login).trim().split(/\s+/);
        const iniciais = partes.length > 1
          ? (partes[0][0] + partes[partes.length - 1][0]).toUpperCase()
          : (user.nome || user.login).substring(0, 2).toUpperCase();
        elements.headerUserAvatar.textContent = iniciais;
      }

      // Badge de perfil
      if (elements.headerUserRole) {
        elements.headerUserRole.textContent = user.perfil || 'CONSULTA';
        elements.headerUserRole.className = 'user-role-badge role-' + (user.perfil ? user.perfil.toLowerCase() : 'consulta');
      }

      // UG Vinculada
      if (elements.headerUserUg) {
        elements.headerUserUg.textContent = user.ug_vinculada === 'TODAS' || !user.ug_vinculada ? 'SENAPPEN' : user.ug_vinculada;
      }
    }

    // Aplica regras de controle de acesso (RBAC)
    aplicarPermissoesUsuario();
  }

  function aplicarPermissoesUsuario() {
    const user = state.usuarioLogado;
    if (!user) return;

    const perfil = user.perfil || 'CONSULTA';

    if (perfil === 'ADMIN') {
      // Administrador: acesso irrestrito
      if (elements.tabConfig) elements.tabConfig.style.display = 'inline-flex';
      if (elements.subtabUsuarios) elements.subtabUsuarios.style.display = 'inline-flex';
      if (elements.ugSelect) elements.ugSelect.disabled = false;
    } else if (perfil === 'GESTOR_UG') {
      // Gestor UG: oculta aba de Administração, restringe filtro à sua UG
      if (elements.tabConfig) elements.tabConfig.style.display = 'none';
      if (user.ug_vinculada && user.ug_vinculada !== 'TODAS') {
        state.filters.ug = user.ug_vinculada;
        if (elements.ugSelect) {
          elements.ugSelect.value = user.ug_vinculada;
          elements.ugSelect.disabled = true;
          elements.ugSelect.title = `Acesso de edição restrito à UG ${user.ug_vinculada}`;
        }
        applyFilters();
      }
    } else {
      // Somente Consulta: oculta Administração, desativa edições
      if (elements.tabConfig) elements.tabConfig.style.display = 'none';
      if (elements.ugSelect) elements.ugSelect.disabled = false;
    }
  }

  async function efetuarLogin(e) {
    if (e) e.preventDefault();
    const login = elements.loginUsername.value.trim();
    const senha = elements.loginPassword.value;

    if (!login || !senha) {
      exibirFeedbackLogin('Informe o usuário e a senha para acessar.', 'error');
      return;
    }

    exibirFeedbackLogin('Autenticando credenciais...', 'loading');
    elements.btnLoginSubmit.disabled = true;

    try {
      const res = await ApiClient.executar('autenticar', { login, senha });
      elements.btnLoginSubmit.disabled = false;

      if (res && res.status === 'success' && res.usuario) {
        exibirFeedbackLogin('Acesso concedido! Carregando painel...', 'success');
        sessionStorage.setItem(SESSION_KEY, JSON.stringify(res.usuario));
        state.usuarioLogado = res.usuario;

        setTimeout(() => {
          aplicarUsuarioLogado();
          showToast(`Bem-vindo(a), ${res.usuario.nome || res.usuario.login}!`, 'success');
          carregarUsuarios();
          carregarDadosDoBancoGoogle();
        }, 350);
      } else {
        exibirFeedbackLogin(res.mensagem || 'Usuário ou senha incorretos.', 'error');
      }
    } catch (err) {
      elements.btnLoginSubmit.disabled = false;
      exibirFeedbackLogin('Erro ao conectar ao serviço de autenticação.', 'error');
    }
  }

  function exibirFeedbackLogin(msg, tipo) {
    if (!elements.loginFeedback) return;
    elements.loginFeedback.textContent = msg;
    elements.loginFeedback.className = 'login-feedback ' + tipo;
    elements.loginFeedback.style.display = 'flex';
  }

  function efetuarLogout() {
    sessionStorage.removeItem(SESSION_KEY);
    state.usuarioLogado = null;
    if (elements.loginPassword) elements.loginPassword.value = '';
    if (elements.loginFeedback) elements.loginFeedback.style.display = 'none';
    exibirTelaLogin();
    showToast('Sessão encerrada com sucesso.', 'info');
  }

  // Inicialização
  function init() {
    // 1. Carga inicial rápida com dados locais
    renderCronograma();
    populateUgSelects();
    populateHeaderExercicioSelect();
    preencherSelectsConfig();
    renderCiclosTable();
    renderCronogramaTable();
    attachEvents();
    applyFilters();

    // 2. Verificação de sessão
    const usuarioAtivo = verificarSessaoUsuario();
    if (usuarioAtivo && state.usuarioLogado && state.usuarioLogado.perfil === 'ADMIN') {
      carregarUsuarios();
    }

    // 3. Sincronização em tempo real com as planilhas oficiais (tb_ug, tb_inventario_acompanhamento, tb_ciclo_inventario, etc.)
    carregarDadosDoBancoGoogle();
  }

  function sincronizarInterfaceComDados() {
    renderCronograma();
    populateUgSelects();
    populateHeaderExercicioSelect();
    preencherSelectsConfig();
    renderCiclosTable();
    renderCronogramaTable();
    populateGestaoUorgSelect();
    applyFilters();
    if (state.currentConfigSubtab === 'ugs') renderConfigUgsTable();
    if (state.currentConfigSubtab === 'uorgs') renderConfigUorgsTable();
  }

  function populateHeaderExercicioSelect() {
    const select = document.getElementById('header-exercicio-select');
    if (!select) return;

    select.innerHTML = '';
    const ciclos = state.ciclos || [];
    const listaCiclos = ciclos.length > 0 ? [...ciclos] : [
      { ano_exercicio: 2026, ano: 2026, ativo: 'S', processo_sei_mae: '08016.007081/2026-59', oficio_circular: 'Ofício Circular nº /2026/DIREX (SEI 35011389)' }
    ];

    // Ordena do ano mais recente para o mais antigo
    listaCiclos.sort((a, b) => {
      const anoA = parseInt(a.ano_exercicio || a.ano, 10) || 0;
      const anoB = parseInt(b.ano_exercicio || b.ano, 10) || 0;
      return anoB - anoA;
    });

    // Ciclo padrão é o ativo ou o mais recente
    let cicloPadrao = listaCiclos.find(c => c.ativo === 'S') || listaCiclos[0];

    listaCiclos.forEach(c => {

        if (Array.isArray(res.inventario) && res.inventario.length > 0) {
          state.allData = normalizarUorgs(res.inventario);

        if (Array.isArray(res.ugs) && res.ugs.length > 0) {

      });
  }

  /**
   * Formata datas para o padrão amigável brasileiro (DD/MM/AAAA)
   */
  function formatarDataPtBr(valor) {
    if (!valor) return '-';
    if (typeof valor !== 'string') {
      if (valor instanceof Date) {
        const dia = String(valor.getDate()).padStart(2, '0');
        const mes = String(valor.getMonth() + 1).padStart(2, '0');
        const ano = valor.getFullYear();
        return `${dia}/${mes}/${ano}`;
      }
      valor = String(valor);
    }

    valor = valor.trim();
    if (!valor) return '-';

    // Se já for DD/MM/AAAA ou período como '01-02/09/2026' ou '27-28/08/2026'
    if (/^\d{2}\/\d{2}\/\d{4}$/.test(valor) || /^\d{2}-\d{2}\/\d{2}\/\d{4}$/.test(valor)) {
      return valor;
    }

    // Se contiver GMT ou Horário Padrão ou formato do Date.toString() (ex: 'Tue Jul 28 2026...')
    if (valor.includes('GMT') || valor.includes('Horário') || /^[A-Za-z]{3}\s+[A-Za-z]{3}/.test(valor)) {
      const parsed = new Date(valor);
      if (!isNaN(parsed.getTime())) {
        const dia = String(parsed.getDate()).padStart(2, '0');
        const mes = String(parsed.getMonth() + 1).padStart(2, '0');
        const ano = parsed.getFullYear();
        return `${dia}/${mes}/${ano}`;
      }
    }

    // Se for formato ISO YYYY-MM-DD (ex: '2026-08-31' ou '2026-08-31T...')
    const matchIso = valor.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (matchIso) {
      return `${matchIso[3]}/${matchIso[2]}/${matchIso[1]}`;
    }

    return valor;
  }

  function converterParaInputDate(valor) {
    if (!valor) return '';
    if (valor instanceof Date) {
      return valor.toISOString().split('T')[0];
    }
    const str = String(valor).trim();
    const matchPtBr = str.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
    if (matchPtBr) {
      return `${matchPtBr[3]}-${matchPtBr[2]}-${matchPtBr[1]}`;
    }
    const matchIso = str.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (matchIso) {
      return `${matchIso[1]}-${matchIso[2]}-${matchIso[3]}`;
    }
    const parsed = new Date(str);
    if (!isNaN(parsed.getTime())) {
      const y = parsed.getFullYear();
      const m = String(parsed.getMonth() + 1).padStart(2, '0');
      const d = String(parsed.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }
    return '';
  }

  function resetFilters() {
    state.filters = { search: '', grupo: 'TODOS', ug: 'TODAS', status: 'TODOS' };
    state.activeKpiFilter = null;
    elements.searchInput.value = '';
    elements.grupoSelect.value = 'TODOS';

    filterUgSelectOptions('TODOS', true);
    elements.ugSelect.value = 'TODAS';

  function applyFilters() {
    state.filteredData = state.allData.filter(item => {
      // O Dashboard considera exclusivamente UORGs e UGs ativas!
      if (item.ativo === 'N') return false;

      // Se a UG pai estiver inativa, também não exibe no dashboard
      const ugPai = state.ugs.find(u => u.sigla === item.ug_sigla);
      if (ugPai && ugPai.ativo === 'N') return false;

      if (state.filters.search) {
        const term = state.filters.search;
        const matchesUorg = item.uorg_codigo && item.uorg_codigo.toString().toLowerCase().includes(term);
        const matchesSigla = item.uorg_sigla && item.uorg_sigla.toLowerCase().includes(term);
        const matchesProc = item.processo_sei && item.processo_sei.toLowerCase().includes(term);
        const matchesUg = item.ug_sigla && item.ug_sigla.toLowerCase().includes(term);
        if (!matchesUorg && !matchesSigla && !matchesProc && !matchesUg) return false;
      }

      if (state.filters.grupo !== 'TODOS' && item.ug_tipo !== state.filters.grupo) return false;
      if (state.filters.ug !== 'TODAS' && item.ug_sigla !== state.filters.ug) return false;
      if (state.filters.status !== 'TODOS' && item.status_simplificado !== state.filters.status) return false;

      return true;
    });

    renderMetrics();
    renderUgCards();
    renderTable();
  }

  function fallbackCopyText(text) {
    const textArea = document.createElement('textarea');
    textArea.value = text;
    textArea.style.position = 'fixed';
    textArea.style.opacity = '0';
    document.body.appendChild(textArea);
    textArea.focus();
    textArea.select();
    try {
      document.execCommand('copy');
    } catch (e) {
      console.warn('Fallback copy failed', e);
    }
    document.body.removeChild(textArea);
  }

  function renderProcessoSeiWithCopy(proc, link = '', extraStyle = '') {
    if (!proc) return '<span class="sei-empty">Não autuado</span>';
    const procEscaped = String(proc).trim();
    const linkHtml = link ? `
      <a href="${link}" target="_blank" rel="noopener noreferrer" class="sei-link" title="Abrir no SEI">
        ${procEscaped} ↗
      </a>
    ` : `<span class="sei-link" style="text-decoration:none">${procEscaped}</span>`;

    return `
      <span class="sei-copy-wrapper" data-sei="${procEscaped}" ${extraStyle ? `style="${extraStyle}"` : ''}>
        ${linkHtml}
        <button type="button" class="btn-copy-sei" title="Copiar processo SEI" aria-label="Copiar número do processo SEI">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
        </button>
      </span>
    `;
  }

  function renderMetrics() {
    const total = state.filteredData.length;
    let naoIniciado = 0, emAndamento = 0, processado = 0;

    state.filteredData.forEach(d => {
      if (d.status_simplificado === 'Não iniciado') naoIniciado++;
      else if (d.status_simplificado === 'Em andamento') emAndamento++;
      else if (d.status_simplificado === 'Processado') processado++;
    });

    const pctNaoIniciado = total > 0 ? ((naoIniciado / total) * 100).toFixed(1) : '0.0';
    const pctEmAndamento = total > 0 ? ((emAndamento / total) * 100).toFixed(1) : '0.0';
    const pctProcessado = total > 0 ? ((processado / total) * 100).toFixed(1) : '0.0';
    const restanteParaProcessar = total - processado;

    elements.kpiTotal.textContent = total;

    // Atualiza o subtítulo com a quantidade de UGs ativas
    const ugsAtivasCount = state.ugs.filter(u => u.ativo !== 'N').length;
    const elTotalSub = document.getElementById('kpi-total-sub');
    if (elTotalSub) {
      elTotalSub.textContent = `Unidades em ${ugsAtivasCount} Unidades Gestoras`;
    }

    elements.kpiNaoIniciadoVal.textContent = naoIniciado;
    elements.kpiNaoIniciadoPct.textContent = `${pctNaoIniciado}%`;

    elements.kpiEmAndamentoVal.textContent = emAndamento;
    elements.kpiEmAndamentoPct.textContent = `${pctEmAndamento}%`;

    elements.kpiProcessadoVal.textContent = processado;
    elements.kpiProcessadoPct.textContent = `${pctProcessado}%`;

    elements.kpiRestaVal.textContent = restanteParaProcessar;
    elements.kpiRestaSubtitle.textContent = `${((restanteParaProcessar / (total || 1)) * 100).toFixed(1)}% do escopo restante`;

    elements.segNaoIniciado.style.width = `${pctNaoIniciado}%`;
    elements.segEmAndamento.style.width = `${pctEmAndamento}%`;
    elements.segProcessado.style.width = `${pctProcessado}%`;

    elements.legNaoIniciado.textContent = `Não iniciado: ${naoIniciado} (${pctNaoIniciado}%)`;
    elements.legEmAndamento.textContent = `Em andamento: ${emAndamento} (${pctEmAndamento}%)`;
    elements.legProcessado.textContent = `Processado: ${processado} (${pctProcessado}%)`;
  }

  function renderUgCards() {
    if (elements.ugGridDiretorias) elements.ugGridDiretorias.innerHTML = '';
    if (elements.ugGridPf) elements.ugGridPf.innerHTML = '';

    const ugGroups = {};
    const ugsAtivas = state.ugs.filter(ug => ug.ativo !== 'N');
    ugsAtivas.forEach(ug => {
      ugGroups[ug.sigla] = { meta: ug, total: 0, naoIniciado: 0, emAndamento: 0, processado: 0 };
    });

    let totalUorgsDiretoria = 0;
    let totalUorgsPf = 0;
    let ugsComDadosDiretoria = 0;
    let ugsComDadosPf = 0;

    state.filteredData.forEach(item => {
      if (ugGroups[item.ug_sigla]) {
        ugGroups[item.ug_sigla].total++;
        if (item.status_simplificado === 'Não iniciado') ugGroups[item.ug_sigla].naoIniciado++;
        else if (item.status_simplificado === 'Em andamento') ugGroups[item.ug_sigla].emAndamento++;
        else if (item.status_simplificado === 'Processado') ugGroups[item.ug_sigla].processado++;

        if (item.ug_tipo === 'DIRETORIA') totalUorgsDiretoria++;
        else totalUorgsPf++;
      }
    });

    Object.values(ugGroups).forEach(ug => {
      if (ug.total === 0) return;

      const isDiretoria = ug.meta.tipo === 'DIRETORIA';
      if (isDiretoria) ugsComDadosDiretoria++;
      else ugsComDadosPf++;

      const card = document.createElement('div');
      card.className = `ug-card ${state.filters.ug === ug.meta.sigla ? 'selected' : ''}`;
      const pctEmAnd = ((ug.emAndamento / ug.total) * 100).toFixed(0);
      const pctNaoIni = ((ug.naoIniciado / ug.total) * 100).toFixed(0);
      const pctProc = ((ug.processado / ug.total) * 100).toFixed(0);
      const tipoBadge = isDiretoria ? 'Sede' : 'Penitenciária Federal';

      card.innerHTML = `
        <div class="ug-card-title-row">
          <span class="ug-sigla">${ug.meta.sigla}</span>
          <span class="ug-tipo-pill">${tipoBadge}</span>
        </div>
        <div class="ug-card-name" title="${ug.meta.nome}">${ug.meta.nome}</div>
        <div class="ug-card-metrics">
          <span>Total: <strong>${ug.total}</strong></span>
          <span>Em andamento: <strong style="color: var(--status-em-andamento)">${ug.emAndamento}</strong></span>
          <span>Não iniciado: <strong style="color: var(--status-nao-iniciado)">${ug.naoIniciado}</strong></span>
        </div>
        <div class="progress-bar-multi" style="height: 8px;">
          <div class="progress-segment nao-iniciado" style="width: ${pctNaoIni}%"></div>
          <div class="progress-segment em-andamento" style="width: ${pctEmAnd}%"></div>
          <div class="progress-segment processado" style="width: ${pctProc}%"></div>
        </div>
      `;

      card.addEventListener('click', () => {
        state.filters.ug = (state.filters.ug === ug.meta.sigla) ? 'TODAS' : ug.meta.sigla;
        elements.ugSelect.value = state.filters.ug;
        applyFilters();
      });

      if (isDiretoria && elements.ugGridDiretorias) {
        elements.ugGridDiretorias.appendChild(card);
      } else if (!isDiretoria && elements.ugGridPf) {
        elements.ugGridPf.appendChild(card);
      }
    });

    // Atualiza badges de cabeçalho dos blocos
    if (elements.ugMetaDiretorias) {
      elements.ugMetaDiretorias.textContent = `${ugsComDadosDiretoria} UGs • ${totalUorgsDiretoria} UORGs`;
    }
    if (elements.ugMetaPf) {
      elements.ugMetaPf.textContent = `${ugsComDadosPf} UGs • ${totalUorgsPf} UORGs`;
    }
  }

  /**
   * Valida se o usuário logado possui permissão para editar uma UORG (RBAC)
   */
  function usuarioPodeEditarUorg(item) {
    const user = state.usuarioLogado;
    if (!user) return false;
    if (user.perfil === 'ADMIN') return true;
    if (user.perfil === 'GESTOR_UG') {
      return user.ug_vinculada === 'TODAS' || user.ug_vinculada === item.ug_sigla;
    }
    return false; // Perfil CONSULTA ou não autenticado
  }

  /**
   * Atualização rápida do Status Simplificado com atualização otimista e persistência no banco
   */
  async function atualizarStatusUorgRapido(id, novoStatus) {
    const item = state.allData.find(d => d.id === id);
    if (!item) return;

    if (!usuarioPodeEditarUorg(item)) {
      showToast('Você não possui permissão para alterar o status desta UORG.', 'error');
      renderTable();
      return;
    }

    const statusAnterior = item.status_simplificado;
    if (statusAnterior === novoStatus) return;

    // Atualização otimista imediata na UI
    item.status_simplificado = novoStatus;
    applyFilters();
    showToast(`✓ Status de ${item.uorg_sigla} alterado para "${novoStatus}"!`, 'success');

    // Persistência assíncrona no backend
    const payload = {
      id: id,
      processo_sei: item.processo_sei || '',
      processo_sei_link: item.processo_sei_link || '',
      bens_acautelados_doc: item.bens_acautelados_doc || '',
      relatorio_uorg: item.relatorio_uorg || '',
      relatorio_final_ug: item.relatorio_final_ug || '',
      status_simplificado: novoStatus
    };

    try {
      const res = await ApiClient.executar('salvarUorg', { uorg: payload });
      if (!res || res.status !== 'success') {
        console.warn('Falha ao persistir status rápido no servidor:', res);
        item.status_simplificado = statusAnterior;
        applyFilters();
        showToast('Erro ao salvar no banco: ' + ((res && res.mensagem) || 'Falha'), 'error');
      }
    } catch (err) {
      console.error('Erro de rede ao salvar status rápido:', err);
      item.status_simplificado = statusAnterior;
      applyFilters();
      showToast('Erro de comunicação ao salvar status: ' + (err.message || err.toString()), 'error');
    }
  }

      return;

                        : (item.status_simplificado === 'Em andamento' ? 'em-andamento' : 'nao-iniciado');

      const procHtml = renderProcessoSeiWithCopy(item.processo_sei, item.processo_sei_link);

      const cautelaHtml = item.bens_acautelados_doc ? `

          ✓ Entregue
        </span>
      ` : `<span class="sei-empty">Pendente</span>`;

      const statusHtml = podeEditar ? `
        <select class="status-pill status-pill-select ${statusClass}" data-id="${item.id}" title="Alteração rápida de status (clique para escolher)">
          <option value="Não iniciado" ${item.status_simplificado === 'Não iniciado' ? 'selected' : ''}>🔴 Não iniciado</option>
          <option value="Em andamento" ${item.status_simplificado === 'Em andamento' ? 'selected' : ''}>🟡 Em andamento</option>
          <option value="Processado" ${item.status_simplificado === 'Processado' ? 'selected' : ''}>🟢 Processado</option>
        </select>
      ` : `
        <span class="status-pill ${statusClass}">
          <span class="legend-dot ${statusClass}"></span>
          ${item.status_simplificado}
        </span>
      `;

      tr.innerHTML = `
        <td style="font-weight: 700; color: var(--primary)">${item.ug_sigla}</td>
        <td style="font-family: var(--font-mono); font-weight: 600">${item.uorg_codigo || '-'}</td>
        <td style="font-weight: 600">${item.uorg_sigla}</td>
        <td>${statusHtml}</td>
        <td>${procHtml}</td>
        <td>${cautelaHtml}</td>
        <td>
          <button class="btn-action btn-edit-row" data-id="${item.id}" style="padding: 4px 10px; font-size: 12px">
            ✏️ Editar
          </button>
        </td>
      `;

      const selectStatus = tr.querySelector('.status-pill-select');
      if (selectStatus) {
        selectStatus.addEventListener('click', (e) => e.stopPropagation());
        selectStatus.addEventListener('change', (e) => {
          e.stopPropagation();
          atualizarStatusUorgRapido(item.id, e.target.value);
        });
      }

      tr.querySelector('.btn-edit-row').addEventListener('click', (e) => {
        e.stopPropagation();
        abrirEdicaoNoModuloGestao(item.id);
      });

      tr.addEventListener('click', (e) => {
        if (!e.target.closest('a') && !e.target.closest('button') && !e.target.closest('select')) {
          openModal(item);
        }
      });

      elements.tableBody.appendChild(tr);
    });
  }

    const item = state.allData.find(d => d.id === id);

    state.selectedUorgId = id;
    elements.inputFormId.value = item.id;
    elements.inputFormUg.value = `${item.ug_sigla} — ${item.ug_nome}`;

    elements.inputFormSigla.value = item.uorg_sigla || '';
    elements.inputFormProc.value = item.processo_sei || '';
    elements.inputFormProcLink.value = item.processo_sei_link || '';
    elements.inputFormCautela.value = item.bens_acautelados_doc || '';
    elements.inputFormRelUorg.value = item.relatorio_uorg || '';
    elements.inputFormRelFin.value = item.relatorio_final_ug || '';
    elements.selectFormStatus.value = item.status_simplificado || 'Não iniciado';

    // Controle de Permissão por Perfil

    elements.inputFormProcLink.disabled = !podeEditar;
    elements.inputFormCautela.disabled = !podeEditar;
    elements.inputFormRelUorg.disabled = !podeEditar;
    elements.inputFormRelFin.disabled = !podeEditar;
    elements.selectFormStatus.disabled = !podeEditar;

    if (elements.btnSalvarGestao) {
      elements.btnSalvarGestao.style.display = podeEditar ? 'inline-flex' : 'none';
    }

    if (isConsulta) {
      showToast('Visualização em modo de leitura (perfil de consulta)', 'info');
    } else if (isGestorOutraUg) {
      showToast(`Atenção: Edição permitida apenas para a respectiva UG (${item.ug_sigla})`, 'warning');
    }

    elements.gestaoForm.style.display = 'block';
  }

  function limparFormularioGestao() {
    state.selectedUorgId = null;
    elements.gestaoForm.reset();
    elements.gestaoForm.style.display = 'none';
  }

  function salvarFormularioGestao() {
    const id = parseInt(elements.inputFormId.value, 10);
    if (!id) return;

    const payload = {
      id: id,
      processo_sei: elements.inputFormProc.value.trim(),
      processo_sei_link: elements.inputFormProcLink.value.trim(),
      bens_acautelados_doc: elements.inputFormCautela.value.trim(),
      relatorio_uorg: elements.inputFormRelUorg.value.trim(),
      relatorio_final_ug: elements.inputFormRelFin.value.trim(),
      status_simplificado: elements.selectFormStatus.value
    };

    elements.btnSalvarGestao.disabled = true;
    elements.btnSalvarGestao.textContent = 'Salvando...';

    ApiClient.executar('salvarUorg', { uorg: payload })
      .then((res) => {
        elements.btnSalvarGestao.disabled = false;
        elements.btnSalvarGestao.textContent = '💾 Salvar Alterações';

        if (res && res.status === 'success') {
          atualizarItemNoEstadoLocal(id, payload);
          limparFormularioGestao();
          elements.gestaoSelectUorg.value = '';
          showToast('✓ Informações da UORG atualizadas com sucesso!', 'success');
          switchView('dashboard');
          carregarDadosDoBancoGoogle();
        } else {
          showToast('Erro ao salvar: ' + (res.mensagem || 'Erro desconhecido'), 'error');
        }
      })
      .catch((err) => {
        elements.btnSalvarGestao.disabled = false;
        elements.btnSalvarGestao.textContent = '💾 Salvar Alterações';
        showToast('Erro de comunicação: ' + err.toString(), 'error');
      });
  }

  function atualizarItemNoEstadoLocal(id, payload) {
    const item = state.allData.find(d => d.id === id);
    if (item) {
      Object.assign(item, payload);
      applyFilters();
      populateGestaoUorgSelect();
      elements.gestaoSelectUorg.value = id;
    }
  }

  function showToast(message, type = 'success') {
    const toast = document.createElement('div');

    toast.textContent = message;
    elements.toastContainer.appendChild(toast);

    setTimeout(() => toast.classList.add('show'), 10);
    setTimeout(() => {
      toast.classList.remove('show');
      setTimeout(() => toast.remove(), 300);
    }, 4000);
  }

  /**
   * Exibe um modal de confirmação amigável e retorna uma Promise que resolve em true (confirmado) ou false (cancelado).
   * @param {Object} options
   * @param {string} options.title - Título do diálogo
   * @param {string} options.message - Mensagem principal
   * @param {string} [options.details] - Bloco de detalhes / contexto adicional
   * @param {string} [options.confirmText] - Rótulo do botão de confirmação
   * @param {string} [options.cancelText] - Rótulo do botão de cancelamento
   * @param {string} [options.type] - 'danger' | 'warning' | 'info'
   * @returns {Promise<boolean>}
   */
  function showConfirmDialog({
    title = 'Confirmação',
    message = 'Deseja continuar com esta operação?',
    details = '',
    confirmText = 'Confirmar',
    cancelText = 'Cancelar',
    type = 'danger'
  } = {}) {
    return new Promise((resolve) => {
      if (!elements.confirmOverlay) {
        resolve(window.confirm(message));
        return;
      }

      elements.confirmTitle.textContent = title;
      elements.confirmMessage.textContent = message;

      if (details) {
        elements.confirmDetails.innerHTML = details;
        elements.confirmDetails.style.display = 'block';
      } else {
        elements.confirmDetails.style.display = 'none';
        elements.confirmDetails.innerHTML = '';
      }

      elements.confirmBtnConfirm.textContent = confirmText;
      elements.confirmBtnCancel.textContent = cancelText;

      if (type === 'danger') {
        elements.confirmIcon.className = 'confirm-modal-icon danger';
        elements.confirmIcon.innerHTML = `
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 6h18m-2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            <line x1="10" y1="11" x2="10" y2="17"></line>
            <line x1="14" y1="11" x2="14" y2="17"></line>
          </svg>
        `;
        elements.confirmBtnConfirm.className = 'confirm-btn-confirm btn-danger';
      } else if (type === 'warning') {
        elements.confirmIcon.className = 'confirm-modal-icon warning';
        elements.confirmIcon.innerHTML = `
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"></path>
            <line x1="12" y1="9" x2="12" y2="13"></line>
            <line x1="12" y1="17" x2="12.01" y2="17"></line>
          </svg>
        `;
        elements.confirmBtnConfirm.className = 'confirm-btn-confirm btn-warning';
      } else {
        elements.confirmIcon.className = 'confirm-modal-icon info';
        elements.confirmIcon.innerHTML = `
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="16" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12.01" y2="8"></line>
          </svg>
        `;
        elements.confirmBtnConfirm.className = 'confirm-btn-confirm btn-primary';
      }

      let isClosed = false;
      const cleanup = (result) => {
        if (isClosed) return;
        isClosed = true;
        elements.confirmOverlay.classList.remove('active');
        elements.confirmBtnConfirm.removeEventListener('click', onConfirm);
        elements.confirmBtnCancel.removeEventListener('click', onCancel);
        elements.confirmOverlay.removeEventListener('click', onBackdropClick);
        document.removeEventListener('keydown', onKeyDown);
        resolve(result);
      };

      const onConfirm = () => cleanup(true);
      const onCancel = () => cleanup(false);
      const onBackdropClick = (e) => {
        if (e.target === elements.confirmOverlay) cleanup(false);
      };
      const onKeyDown = (e) => {
        if (e.key === 'Escape') cleanup(false);
      };

      elements.confirmBtnConfirm.addEventListener('click', onConfirm);
      elements.confirmBtnCancel.addEventListener('click', onCancel);
      elements.confirmOverlay.addEventListener('click', onBackdropClick);
      document.addEventListener('keydown', onKeyDown);

      elements.confirmOverlay.classList.add('active');
      elements.confirmBtnCancel.focus();
    });
  }

  function exportFilteredCsv() {
    if (!state.filteredData || state.filteredData.length === 0) {
      showToast('Nenhum dado encontrado para exportação.', 'warning');
      return;
    }
    const cicloAno = state.cicloAtivo?.ano_exercicio || state.cicloAtivo?.ano || 2026;
    const dataStr = new Date().toISOString().slice(0, 10);
    const headers = [
      'UG', 'Nome_UG', 'Codigo_UORG', 'SETOR_SIGLA', 'Status_Fase',
      'Processo_SEI', 'Link_SEI', 'Bens_Acautelados', 'Relatorio_UORG', 'Relatorio_Final_UG'
    ];
    const rows = state.filteredData.map(d => [
      `"${(d.ug_sigla || '').replace(/"/g, '""')}"`,
      `"${(d.ug_nome || '').replace(/"/g, '""')}"`,
      `"${(d.uorg_codigo || '').toString().replace(/"/g, '""')}"`,
      `"${(d.uorg_sigla || '').replace(/"/g, '""')}"`,
      `"${(d.status_simplificado || '').replace(/"/g, '""')}"`,
      `"${(d.processo_sei || '').replace(/"/g, '""')}"`,
      `"${(d.processo_sei_link || '').replace(/"/g, '""')}"`,
      `"${(d.bens_acautelados_doc || '').replace(/"/g, '""')}"`,
      `"${(d.relatorio_uorg || '').replace(/"/g, '""')}"`,
      `"${(d.relatorio_final_ug || '').replace(/"/g, '""')}"`
    ]);

    const csvContent = '\uFEFF' + [headers.join(';'), ...rows.map(r => r.join(';'))].join('\n');
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `relacao_uorgs_inventario_senappen_${cicloAno}_${dataStr}.csv`;
    a.click();
    URL.revokeObjectURL(url);
    showToast(`✓ Arquivo CSV exportado com sucesso!`, 'success');
  }

  function exportFilteredXlsx() {
    if (!state.filteredData || state.filteredData.length === 0) {
      showToast('Nenhum dado encontrado para exportação.', 'warning');
      return;
    }

    if (typeof XLSX === 'undefined') {
      showToast('Recurso XLSX indisponível. Gerando exportação em CSV...', 'info');
      exportFilteredCsv();
      return;
    }

    const cicloAno = state.cicloAtivo?.ano_exercicio || state.cicloAtivo?.ano || 2026;
    const dataStr = new Date().toISOString().slice(0, 10);

    // Mapeamento formatado e padronizado em Português
    const dadosExcel = state.filteredData.map(item => ({
      'UG': item.ug_sigla || '',
      'Nome da UG': item.ug_nome || '',
      'Código UORG': item.uorg_codigo || '',
      'SETOR/SIGLA': item.uorg_sigla || '',
      'Status da Fase': item.status_simplificado || '',
      'Número do Processo SEI': item.processo_sei || '',
      'Link Direto do SEI': item.processo_sei_link || '',
      'Declaração de Bens Acautelados': item.bens_acautelados_doc || '',
      'Relatório Setorial da UORG': item.relatorio_uorg || '',
      'Relatório Final Consolidado da UG': item.relatorio_final_ug || ''
    }));

    // Cria a planilha e a pasta de trabalho (Workbook)
    const ws = XLSX.utils.json_to_sheet(dadosExcel);

    // Configuração de larguras automáticas de colunas
    ws['!cols'] = [
      { wch: 10 }, // UG
      { wch: 38 }, // Nome da UG
      { wch: 15 }, // Código UORG
      { wch: 20 }, // SETOR/SIGLA
      { wch: 20 }, // Status da Fase
      { wch: 26 }, // Número do Processo SEI
      { wch: 45 }, // Link Direto do SEI
      { wch: 35 }, // Declaração de Bens Acautelados
      { wch: 28 }, // Relatório Setorial da UORG
      { wch: 28 }  // Relatório Final Consolidado da UG
    ];

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, `UORGs_${cicloAno}`);

    const fileName = `relacao_uorgs_inventario_senappen_${cicloAno}_${dataStr}.xlsx`;
    XLSX.writeFile(wb, fileName);
    showToast(`✓ Planilha Excel (.xlsx) exportada com sucesso!`, 'success');
  }

    const dataset = isConsolidado ? state.allData : state.filteredData;

    const ciclo = state.cicloAtivo || {
      ano_exercicio: 2026,
      ano: 2026,
      processo_sei_mae: '08016.007081/2026-59',

    // Totais e percentuais

    dataset.forEach(d => {
      if (d.status_simplificado === 'Não iniciado') naoIniciado++;
      else if (d.status_simplificado === 'Em andamento') emAndamento++;
      else if (d.status_simplificado === 'Processado') processado++;

    const pctNaoIniciado = total > 0 ? ((naoIniciado / total) * 100).toFixed(1) : '0.0';
    const pctEmAndamento = total > 0 ? ((emAndamento / total) * 100).toFixed(1) : '0.0';
    const pctProcessado = total > 0 ? ((processado / total) * 100).toFixed(1) : '0.0';
    const restante = total - processado;
    const pctRestante = total > 0 ? ((restante / total) * 100).toFixed(1) : '0.0';

  function salvarUgAction() {
    const isEdicao = !!elements.formUgId.value;
    const payload = {
      sigla: elements.formUgSigla.value.trim().toUpperCase(),
      codigo_siafi: elements.formUgCodigo.value.trim(),
      nome: elements.formUgNome.value.trim().toUpperCase(),
      tipo: elements.formUgTipo.value,
      processo_sei: elements.formUgProc.value.trim(),
      portaria_designacao: elements.formUgPortaria.value.trim()
    };

    if (!payload.sigla || !payload.nome) {
      showToast('Preencha a Sigla e o Nome da UG!', 'error');
      return;
    }

    const btnSalvar = document.getElementById('btn-salvar-ug');
    btnSalvar.disabled = true;
    btnSalvar.textContent = 'Salvando UG...';

    const aplicarSucesso = (dados) => {
      btnSalvar.disabled = false;
      btnSalvar.textContent = '💾 Salvar UG';
      const idx = state.ugs.findIndex(u => u.sigla === payload.sigla);
      if (idx >= 0) {
        state.ugs[idx] = { ...state.ugs[idx], ...payload };
      } else {
        state.ugs.push(payload);
      }
      populateUgSelects();
      preencherSelectsConfig();
      renderConfigUgsTable();
      renderUgCards();
      fecharFormNovaUg();
      showToast(isEdicao ? `✓ Unidade Gestora ${payload.sigla} atualizada com sucesso!` : `✓ Unidade Gestora ${payload.sigla} cadastrada com sucesso!`, 'success');
      carregarDadosDoBancoGoogle();
    };

    ApiClient.executar('salvarUg', { ug: payload })
      .then((res) => {
        if (res && res.status === 'success') {
          aplicarSucesso(res.dados || payload);

    const lista = state.allData
      .filter(item => {

          (item.uorg_sigla && item.uorg_sigla.toLowerCase().includes(termo)) ||
          (item.uorg_codigo && item.uorg_codigo.toString().includes(termo)) ||
          (item.ug_sigla && item.ug_sigla.toLowerCase().includes(termo));

        const matchUg = filtroUg === 'TODAS' || item.ug_sigla === filtroUg;

  function salvarCicloAction() {
    const payload = {
      id_ciclo: elements.cicloId.value ? parseInt(elements.cicloId.value, 10) : null,
      ano_exercicio: parseInt(elements.cicloAno.value, 10),
      processo_sei_mae: elements.cicloProcMae.value.trim(),
      data_limite_cautela: elements.cicloDataCautela.value,
      data_limite_final: elements.cicloDataFinal.value,
      status_ciclo: elements.cicloStatus.value,
      ativo: elements.cicloDefinirAtivo.checked ? 'S' : 'N'
    };

    if (!payload.ano_exercicio) {
      showToast('Informe o Ano do Exercício!', 'error');
      return;
    }

    const btn = document.getElementById('btn-salvar-ciclo');
    btn.disabled = true;
    btn.textContent = 'Salvando Ciclo...';

    const aplicarSucesso = () => {
      btn.disabled = false;
      btn.textContent = '💾 Salvar Exercício / Ciclo';

      const idx = state.ciclos.findIndex(c => (c.ano_exercicio || c.ano) === payload.ano_exercicio);
      if (payload.ativo === 'S') {
        state.ciclos.forEach(c => { c.ativo = 'N'; });
        state.ciclo = { ...payload };
      }

      if (idx >= 0) {
        state.ciclos[idx] = { ...state.ciclos[idx], ...payload };
      } else {
        payload.id_ciclo = Math.max(...state.ciclos.map(c => c.id_ciclo || 0), 0) + 1;
        state.ciclos.push(payload);
      }

      renderCiclosTable();
      fecharFormCiclo();
      showToast(`✓ Exercício ${payload.ano_exercicio} salvo com sucesso!`, 'success');
      carregarDadosDoBancoGoogle();
    };

    ApiClient.executar('salvarParametrosCiclo', { ciclo: payload })
      .then((res) => {
        if (res && res.status === 'success') {
          aplicarSucesso();
        } else {
          btn.disabled = false;
          btn.textContent = '💾 Salvar Exercício / Ciclo';
          showToast('Erro ao salvar ciclo: ' + (res.mensagem || 'Falha'), 'error');

      .catch((err) => {
        btn.disabled = false;
        btn.textContent = '💾 Salvar Exercício / Ciclo';
        showToast('Erro de comunicação: ' + err.toString(), 'error');
      });

      elements.formEtapaId.value = '';
    }
    elements.formEtapaCronograma.scrollIntoView({ behavior: 'smooth' });
  }

  function fecharFormEtapaCronograma() {
    elements.formEtapaCronograma.reset();
    elements.formEtapaId.value = '';
    elements.formEtapaCronograma.style.display = 'none';
  }

  function salvarEtapaCronogramaAction() {
    const idVal = elements.formEtapaId.value;
    const isEdicao = idVal !== '';
    const payload = {
      id_etapa: isEdicao ? parseInt(idVal, 10) : null,
      data: elements.etapaData.value.trim(),
      label: elements.etapaData.value.trim(),
      responsavel: elements.etapaResponsavel.value.trim(),
      acao: elements.etapaAcao.value.trim(),
      status: elements.etapaStatus.value
    };

    if (!payload.data || !payload.acao || !payload.responsavel) {
      showToast('Preencha todos os campos da etapa!', 'error');
      return;
    }

    const btn = document.getElementById('btn-salvar-etapa');
    btn.disabled = true;
    btn.textContent = 'Salvando Etapa...';

    const aplicarSucesso = () => {
      btn.disabled = false;
      btn.textContent = '💾 Salvar Etapa';

      if (isEdicao && !isNaN(payload.id_etapa)) {
        const itemIdx = state.cronograma.findIndex(e => String(e.id_etapa) === String(payload.id_etapa));
        if (itemIdx >= 0) {
          state.cronograma[itemIdx] = { ...state.cronograma[itemIdx], ...payload };
        } else {
          state.cronograma.push(payload);
        }
      } else {
        state.cronograma.push(payload);
      }

      renderCronogramaTable();
      renderCronograma(); // Atualiza a régua visual do Dashboard!
      fecharFormEtapaCronograma();
      showToast('✓ Cronograma oficial atualizado com sucesso!', 'success');
      carregarDadosDoBancoGoogle();
    };

    ApiClient.executar('salvarEtapaCronograma', { etapa: payload })
      .then((res) => {
        if (res && res.status === 'success') {
          aplicarSucesso();
        } else {
          btn.disabled = false;
          btn.textContent = '💾 Salvar Etapa';
          showToast('Erro ao salvar etapa: ' + (res.mensagem || 'Falha'), 'error');
        }
      })
      .catch((err) => {
        btn.disabled = false;
        btn.textContent = '💾 Salvar Etapa';
        showToast('Erro de comunicação: ' + err.toString(), 'error');
      });
  }

  async function excluirEtapaCronogramaAction(item, index) {
    const confirmed = await showConfirmDialog({
      title: 'Remover Etapa do Cronograma',
      message: 'Deseja remover esta etapa do cronograma e da régua visual de prazos do Dashboard?',
      details: `<strong>Ação / Etapa:</strong> ${item.acao}<br><strong>Data / Prazo:</strong> ${item.label || item.data || 'N/A'}<br><strong>Responsável:</strong> ${item.responsavel || 'N/A'}`,
      confirmText: 'Sim, Remover Etapa',
      cancelText: 'Cancelar',
      type: 'danger'
    });

    if (!confirmed) return;

    const aplicarExclusao = () => {
      state.cronograma.splice(index, 1);
      renderCronogramaTable();
      renderCronograma(); // Atualiza a régua visual do Dashboard!
      showToast('✓ Etapa removida do cronograma!', 'info');
      carregarDadosDoBancoGoogle();
    };

    ApiClient.executar('excluirEtapaCronograma', { id: item.id_etapa || (index + 1) })
      .then((res) => {
        if (res && res.status === 'success') {
          aplicarExclusao();
        } else {
          showToast('Erro ao excluir etapa: ' + (res.mensagem || 'Falha'), 'error');
        }
      })
      .catch((err) => {
        showToast('Erro de comunicação: ' + err.toString(), 'error');
      });
  }

  // ============================================================================
  // MÓDULO 4: GESTÃO DE USUÁRIOS E PERMISSÕES (ADMINISTRADOR)
  // ============================================================================

  async function carregarUsuarios() {
    try {
      const res = await ApiClient.executar('listarUsuarios');
      if (res && res.status === 'success' && Array.isArray(res.dados)) {
        state.usuarios = res.dados;
        if (state.currentConfigSubtab === 'usuarios') {
          renderUsuariosTable();
        }
      }
    } catch (e) {
      console.warn('Erro ao listar usuários:', e);
    }
  }

  function renderUsuariosTable() {
    if (!elements.tableUsuariosBody) return;
    elements.tableUsuariosBody.innerHTML = '';

    const usuarios = state.usuarios || [];
    if (usuarios.length === 0) {
      elements.tableUsuariosBody.innerHTML = `
        <tr>
          <td colspan="7" style="text-align: center; color: var(--text-muted); padding: 24px;">
            Nenhum usuário cadastrado além do administrador padrão.
          </td>
        </tr>
      `;
      return;
    }

    usuarios.forEach(u => {
      const tr = document.createElement('tr');

      const perfilClass = u.perfil === 'ADMIN' ? 'tag-role-admin' : (u.perfil === 'GESTOR_UG' ? 'tag-role-gestor' : 'tag-role-consulta');
      const perfilNome = u.perfil === 'ADMIN' ? 'Administrador' : (u.perfil === 'GESTOR_UG' ? 'Gestor de UG' : 'Somente Consulta');
      const statusBadge = u.ativo !== 'N'
        ? '<span class="status-badge ativo">● Ativo</span>'
        : '<span class="status-badge inativo">● Inativo</span>';

      const dataFormatada = u.data_criacao ? formatarDataPtBr(u.data_criacao) : '-';

      tr.innerHTML = `
        <td style="font-weight: 600; color: var(--text-main);">
          ${u.nome || u.login}
        </td>
        <td>
          <div style="font-size: 13px; font-weight: 500;">${u.login}</div>
          <div style="font-size: 11px; color: var(--text-muted);">${u.email || '-'}</div>
        </td>
        <td>
          <span class="tag-role ${perfilClass}">${perfilNome}</span>
        </td>
        <td>
          <span style="font-weight: 600; font-size: 12px;">${u.ug_vinculada || 'TODAS'}</span>
        </td>
        <td>
          ${statusBadge}
        </td>
        <td style="font-size: 12px; color: var(--text-muted);">
          ${dataFormatada}
        </td>
        <td>
          <div style="display: flex; gap: 6px; align-items: center;">
            <button type="button" class="btn-action btn-edit-user" style="padding: 4px 8px; font-size: 11px;" title="Editar dados do usuário">
              ✏️ Editar
            </button>
            <button type="button" class="btn-action btn-pwd-user" style="padding: 4px 8px; font-size: 11px; background: #f8fafc; border: 1px solid var(--border);" title="Redefinir senha do usuário">
              🔑 Senha
            </button>
            <button type="button" class="btn-action btn-del-user" style="padding: 4px 8px; font-size: 11px; background: #fef2f2; color: #dc2626; border: 1px solid #fee2e2;" title="Excluir usuário">
              🗑️
            </button>
          </div>
        </td>
      `;

      // Event listeners para os botões de ação
      tr.querySelector('.btn-edit-user').addEventListener('click', () => abrirFormNovoUsuario(u));
      tr.querySelector('.btn-pwd-user').addEventListener('click', () => abrirModalAlterarSenha(u));
      tr.querySelector('.btn-del-user').addEventListener('click', () => excluirUsuarioAction(u));

      elements.tableUsuariosBody.appendChild(tr);
    });
  }

  function abrirFormNovoUsuario(u = null) {
    elements.formUsuarioCadastro.style.display = 'block';
    elements.formUsuarioCadastro.scrollIntoView({ behavior: 'smooth' });

    if (u) {
      elements.usuarioId.value = u.id_usuario || u.id;
      elements.formUsuarioTitle.textContent = `Editar Usuário: ${u.nome || u.login}`;
      elements.usuarioNome.value = u.nome || '';
      elements.usuarioLogin.value = u.login || '';
      elements.usuarioEmail.value = u.email || '';
      elements.usuarioPerfil.value = u.perfil || 'GESTOR_UG';
      elements.usuarioUg.value = u.ug_vinculada || 'TODAS';
      elements.usuarioAtivo.value = u.ativo || 'S';

      // Senha opcional ou oculta na edição
      elements.usuarioSenhaGroup.style.display = 'none';
      elements.usuarioSenha.required = false;
      elements.usuarioSenha.value = '';
    } else {
      elements.usuarioId.value = '';
      elements.formUsuarioTitle.textContent = 'Cadastrar Novo Usuário';
      elements.formUsuarioCadastro.reset();
      elements.usuarioSenhaGroup.style.display = 'block';
      elements.usuarioSenha.required = true;
      elements.usuarioPerfil.value = 'GESTOR_UG';
      elements.usuarioUg.value = 'TODAS';
      elements.usuarioAtivo.value = 'S';
    }
  }

  function fecharFormNovoUsuario() {
    elements.formUsuarioCadastro.reset();
    elements.usuarioId.value = '';
    elements.formUsuarioCadastro.style.display = 'none';
  }

  async function salvarUsuarioAction(e) {
    if (e) e.preventDefault();

    const id = elements.usuarioId.value ? parseInt(elements.usuarioId.value, 10) : null;
    const nome = elements.usuarioNome.value.trim();
    const login = elements.usuarioLogin.value.trim().toLowerCase();
    const email = elements.usuarioEmail.value.trim();
    const senha = elements.usuarioSenha.value;
    const perfil = elements.usuarioPerfil.value;
    const ug_vinculada = elements.usuarioUg.value;
    const ativo = elements.usuarioAtivo.value;

    if (!nome || !login) {
      showToast('Nome e Login são obrigatórios.', 'error');
      return;
    }

    if (!id && (!senha || senha.length < 6)) {
      showToast('Para novos usuários, a senha deve ter no mínimo 6 caracteres.', 'error');
      return;
    }

    const payload = {
      id_usuario: id,
      id: id,
      nome,
      login,
      email,
      senha: senha || undefined,
      perfil,
      ug_vinculada,
      ativo
    };

    const btn = elements.formUsuarioCadastro.querySelector('button[type="submit"]');
    if (btn) {
      btn.disabled = true;
      btn.textContent = 'Salvando...';
    }

    try {
      const res = await ApiClient.executar('salvarUsuario', { usuario: payload });
      if (btn) {
        btn.disabled = false;
        btn.textContent = '💾 Salvar Usuário';
      }

      if (res && res.status === 'success') {
        showToast(res.mensagem || 'Usuário salvo com sucesso!', 'success');
        fecharFormNovoUsuario();
        await carregarUsuarios();
        renderUsuariosTable();
      } else {
        showToast(res.mensagem || 'Falha ao salvar usuário.', 'error');
      }
    } catch (err) {
      if (btn) {
        btn.disabled = false;
        btn.textContent = '💾 Salvar Usuário';
      }
      showToast('Erro de comunicação ao salvar usuário: ' + err.toString(), 'error');
    }
  }

  function abrirModalAlterarSenha(usuario) {
    if (!usuario) return;
    const userId = usuario.id_usuario || usuario.id;
    elements.senhaUsuarioId.value = userId;
    elements.senhaUsuarioNome.textContent = `${usuario.nome} (${usuario.login})`;
    elements.novaSenhaInput.value = '';
    elements.confirmaSenhaInput.value = '';
    elements.modalSenhaOverlay.classList.add('active');
    elements.novaSenhaInput.focus();
  }

  function fecharModalAlterarSenha() {
    elements.modalSenhaOverlay.classList.remove('active');
    elements.formAlterarSenhaModal.reset();
  }

  async function confirmarAlterarSenhaAction(e) {
    if (e) e.preventDefault();
    const id = elements.senhaUsuarioId.value;
    const nova = elements.novaSenhaInput.value;
    const confirma = elements.confirmaSenhaInput.value;

    if (!nova || nova.length < 6) {
      showToast('A nova senha deve ter no mínimo 6 caracteres.', 'error');
      return;
    }
    if (nova !== confirma) {
      showToast('As senhas digitadas não coincidem!', 'error');
      return;
    }

    const btn = elements.formAlterarSenhaModal.querySelector('button[type="submit"]');
    if (btn) {
      btn.disabled = true;
      btn.textContent = 'Alterando...';
    }

    try {
      const res = await ApiClient.executar('alterarSenhaUsuario', { id, novaSenha: nova });
      if (btn) {
        btn.disabled = false;
        btn.textContent = 'Alterar Senha';
      }

      if (res && res.status === 'success') {
        showToast('Senha alterada com sucesso!', 'success');
        fecharModalAlterarSenha();
      } else {
        showToast(res.mensagem || 'Falha ao alterar senha.', 'error');
      }
    } catch (err) {
      if (btn) {
        btn.disabled = false;
        btn.textContent = 'Alterar Senha';
      }
      showToast('Erro de comunicação ao alterar senha: ' + err.toString(), 'error');
    }
  }

  async function excluirUsuarioAction(usuario) {
    if (!usuario) return;

    if (usuario.login === 'admin') {
      showToast('O usuário Administrador principal (admin) não pode ser excluído.', 'warning');
      return;
    }

    if (state.usuarioLogado && String(state.usuarioLogado.id_usuario) === String(usuario.id_usuario)) {
      showToast('Você não pode excluir o usuário com o qual está conectado atualmente.', 'warning');
      return;
    }

    const confirmed = await showConfirmDialog({
      title: 'Excluir Usuário',
      message: `Tem certeza que deseja remover o usuário ${usuario.nome || usuario.login}?`,
      details: `<strong>Login:</strong> ${usuario.login}<br><strong>Perfil:</strong> ${usuario.perfil}<br><strong>UG:</strong> ${usuario.ug_vinculada || 'TODAS'}<br><br>Esta ação revogará imediatamente o acesso do servidor ao sistema.`,
      confirmText: 'Sim, Excluir',
      cancelText: 'Cancelar',
      type: 'danger'
    });

    if (!confirmed) return;

    try {
      const res = await ApiClient.executar('excluirUsuario', { id: usuario.id_usuario });
      if (res && res.status === 'success') {
        showToast('Usuário removido com sucesso!', 'info');
        await carregarUsuarios();
        renderUsuariosTable();
      } else {
        showToast(res.mensagem || 'Erro ao excluir usuário.', 'error');
      }
    } catch (err) {
      showToast('Erro de comunicação: ' + err.toString(), 'error');
    }
  }

  // Registro do Service Worker (PWA)
  if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js')
        .then((reg) => {
          console.log('[PWA] Service Worker ativo:', reg.scope);
        })
        .catch((err) => {
          console.warn('[PWA] Registro do Service Worker:', err);
        });
    });
  }

  // Inicializa a aplicação
  init();
});

</script>
