<script>
// Bridge para carregar dados dinâmicos da planilha do GAS
if (typeof google !== 'undefined' && google.script && google.script.run) {
  google.script.run.withSuccessHandler(function(response) {
    if (response && response.status === 'success' && response.dados && response.dados.length > 0) {
      console.log('Dados carregados dinamicamente da planilha via GAS:', response.dados.length);
      window.DASH_DATA.inventario = response.dados;
      window.dispatchEvent(new Event('DOMContentLoaded'));
    }
  }).getInventarioData();
}

/**
 * Aplicação do Painel de Inventário SENAPPEN 2026
 * Arquitetura MVC - Controla o Módulo Dashboard e o Módulo de Gestão Operacional
 */

document.addEventListener('DOMContentLoaded', () => {
  const rawData = window.DASH_DATA;
  if (!rawData || !rawData.inventario) {
    console.error('Dados do inventário não encontrados!');
    return;
  }

  // Estado da Aplicação
  const state = {
    allData: rawData.inventario,
    filteredData: [...rawData.inventario],
    cronograma: rawData.cronograma,
    ugs: rawData.ugs,
    currentView: 'dashboard', // 'dashboard' | 'gestao'
    selectedUorgId: null,
    filters: {
      search: '',
      grupo: 'TODOS',
      ug: 'TODAS',
      status: 'TODOS'
    },
    activeKpiFilter: null
  };

  // Elementos do DOM
  const elements = {
    // Tabs de Navegação
    tabDashboard: document.getElementById('tab-dashboard'),
    tabGestao: document.getElementById('tab-gestao'),
    viewDashboard: document.getElementById('view-dashboard'),
    viewGestao: document.getElementById('view-gestao'),

    // KPIs Dashboard
    kpiTotal: document.getElementById('kpi-total-val'),
    kpiNaoIniciadoVal: document.getElementById('kpi-nao-iniciado-val'),
    kpiNaoIniciadoPct: document.getElementById('kpi-nao-iniciado-pct'),
    kpiEmAndamentoVal: document.getElementById('kpi-em-andamento-val'),
    kpiEmAndamentoPct: document.getElementById('kpi-em-andamento-pct'),
    kpiProcessadoVal: document.getElementById('kpi-processado-val'),
    kpiProcessadoPct: document.getElementById('kpi-processado-pct'),
    kpiRestaVal: document.getElementById('kpi-resta-val'),
    kpiRestaSubtitle: document.getElementById('kpi-resta-sub'),

    // Barra de Progresso
    segNaoIniciado: document.getElementById('seg-nao-iniciado'),
    segEmAndamento: document.getElementById('seg-em-andamento'),
    segProcessado: document.getElementById('seg-processado'),
    legNaoIniciado: document.getElementById('leg-nao-iniciado-txt'),
    legEmAndamento: document.getElementById('leg-em-andamento-txt'),
    legProcessado: document.getElementById('leg-processado-txt'),

    // Cronograma & UGs
    timelineTrack: document.getElementById('timeline-track'),
    ugGridDiretorias: document.getElementById('ug-grid-diretorias'),
    ugGridPf: document.getElementById('ug-grid-pf'),
    ugMetaDiretorias: document.getElementById('ug-meta-diretorias'),
    ugMetaPf: document.getElementById('ug-meta-pf'),

    // Filtros Dashboard
    searchInput: document.getElementById('search-input'),
    grupoSelect: document.getElementById('grupo-select'),
    ugSelect: document.getElementById('ug-select'),
    statusSelect: document.getElementById('status-select'),
    btnReset: document.getElementById('btn-reset'),
    btnExport: document.getElementById('btn-export'),

    // Tabela Dashboard
    tableBody: document.getElementById('table-body'),
    tableCount: document.getElementById('table-count'),

    // Formulário do Módulo de Gestão
    gestaoSelectUorg: document.getElementById('gestao-select-uorg'),
    gestaoForm: document.getElementById('gestao-form'),
    inputFormId: document.getElementById('form-uorg-id'),
    inputFormUg: document.getElementById('form-uorg-ug'),
    inputFormCodigo: document.getElementById('form-uorg-codigo'),
    inputFormSigla: document.getElementById('form-uorg-sigla'),
    inputFormProc: document.getElementById('form-uorg-proc'),
    inputFormProcLink: document.getElementById('form-uorg-proc-link'),
    inputFormCautela: document.getElementById('form-uorg-cautela'),
    inputFormRelUorg: document.getElementById('form-uorg-rel-uorg'),
    inputFormRelFin: document.getElementById('form-uorg-rel-fin'),
    selectFormStatus: document.getElementById('form-uorg-status'),
    btnSalvarGestao: document.getElementById('btn-salvar-gestao'),
    btnCancelarGestao: document.getElementById('btn-cancelar-gestao'),

    // Modal
    modalOverlay: document.getElementById('modal-overlay'),
    modalTitle: document.getElementById('modal-title'),
    modalSubtitle: document.getElementById('modal-subtitle'),
    modalBody: document.getElementById('modal-body'),
    modalClose: document.getElementById('modal-close'),

    // Toast
    toastContainer: document.getElementById('toast-container')
  };

  // Inicialização
  function init() {
    renderCronograma();
    populateUgSelects();
    attachEvents();
    applyFilters();
  }

  function renderCronograma() {
    elements.timelineTrack.innerHTML = '';
    state.cronograma.forEach(item => {
      const el = document.createElement('div');
      el.className = `timeline-item ${item.status}`;
      const statusIcon = item.status === 'concluido' ? '✓' : (item.status === 'em_andamento' ? '⏳' : '📅');
      const statusLabel = item.status === 'concluido' ? 'Concluído' : (item.status === 'em_andamento' ? 'Em curso' : 'Previsto');

      el.innerHTML = `
        <div class="timeline-date">
          <span>${item.label}</span>
          <span title="${statusLabel}">${statusIcon}</span>
        </div>
        <div class="timeline-acao" title="${item.acao}">${item.acao}</div>
        <div class="timeline-resp">${item.responsavel}</div>
      `;
      elements.timelineTrack.appendChild(el);
    });
  }

  function populateUgSelects() {
    elements.ugSelect.innerHTML = '<option value="TODAS">Todas as Diretorias/UGs</option>';
    state.ugs.forEach(ug => {
      const opt = document.createElement('option');
      opt.value = ug.sigla;
      opt.textContent = `${ug.sigla} — ${ug.nome}`;
      elements.ugSelect.appendChild(opt);
    });

    populateGestaoUorgSelect();
  }

  function populateGestaoUorgSelect() {
    elements.gestaoSelectUorg.innerHTML = '<option value="">-- Selecione uma UORG para visualizar e editar --</option>';
    state.allData.forEach(item => {
      const opt = document.createElement('option');
      opt.value = item.id;
      opt.textContent = `[${item.ug_sigla}] ${item.uorg_sigla} (UORG: ${item.uorg_codigo || '-'}) — Status: ${item.status_simplificado}`;
      elements.gestaoSelectUorg.appendChild(opt);
    });
  }

  function attachEvents() {
    // Alternância de Abas (MVC Views)
    elements.tabDashboard.addEventListener('click', () => switchView('dashboard'));
    elements.tabGestao.addEventListener('click', () => switchView('gestao'));

    // Filtros Dashboard
    elements.searchInput.addEventListener('input', (e) => {
      state.filters.search = e.target.value.toLowerCase().trim();
      applyFilters();
    });

    elements.grupoSelect.addEventListener('change', (e) => {
      state.filters.grupo = e.target.value;
      filterUgSelectOptions(e.target.value);
      applyFilters();
    });

    elements.ugSelect.addEventListener('change', (e) => {
      state.filters.ug = e.target.value;
      applyFilters();
    });

    elements.statusSelect.addEventListener('change', (e) => {
      state.filters.status = e.target.value;
      state.activeKpiFilter = null;
      updateKpiCardsHighlight();
      applyFilters();
    });

    elements.btnReset.addEventListener('click', resetFilters);
    elements.btnExport.addEventListener('click', exportFilteredCsv);

    // Click nos Cards de KPI
    setupKpiCardClick('kpi-nao-iniciado', 'Não iniciado');
    setupKpiCardClick('kpi-em-andamento', 'Em andamento');
    setupKpiCardClick('kpi-processado', 'Processado');
    setupKpiCardClick('kpi-total', 'TODOS');

    // Módulo de Gestão: Seleção e Formulário
    elements.gestaoSelectUorg.addEventListener('change', (e) => {
      const id = parseInt(e.target.value, 10);
      if (id) {
        carregarFormularioGestao(id);
      } else {
        limparFormularioGestao();
      }
    });

    elements.gestaoForm.addEventListener('submit', (e) => {
      e.preventDefault();
      salvarFormularioGestao();
    });

    elements.btnCancelarGestao.addEventListener('click', () => {
      limparFormularioGestao();
      elements.gestaoSelectUorg.value = '';
    });

    // Modal
    elements.modalClose.addEventListener('click', closeModal);
    elements.modalOverlay.addEventListener('click', (e) => {
      if (e.target === elements.modalOverlay) closeModal();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });
  }

  function switchView(viewName) {
    state.currentView = viewName;
    if (viewName === 'dashboard') {
      elements.tabDashboard.classList.add('active');
      elements.tabGestao.classList.remove('active');
      elements.viewDashboard.classList.add('active');
      elements.viewGestao.classList.remove('active');
    } else {
      elements.tabDashboard.classList.remove('active');
      elements.tabGestao.classList.add('active');
      elements.viewDashboard.classList.remove('active');
      elements.viewGestao.classList.add('active');
    }
  }

  function filterUgSelectOptions(grupo) {
    const currentUg = elements.ugSelect.value;
    elements.ugSelect.innerHTML = '<option value="TODAS">Todas as Diretorias/UGs</option>';
    
    state.ugs.forEach(ug => {
      let include = true;
      if (grupo === 'DIRETORIA' && ug.tipo !== 'DIRETORIA') include = false;
      if (grupo === 'PENITENCIARIA_FEDERAL' && ug.tipo !== 'PENITENCIARIA_FEDERAL') include = false;

      if (include) {
        const opt = document.createElement('option');
        opt.value = ug.sigla;
        opt.textContent = `${ug.sigla} — ${ug.nome}`;
        elements.ugSelect.appendChild(opt);
      }
    });

    elements.ugSelect.value = elements.ugSelect.querySelector(`option[value="${currentUg}"]`) ? currentUg : 'TODAS';
    state.filters.ug = elements.ugSelect.value;
  }

  function setupKpiCardClick(id, statusValue) {
    const card = document.getElementById(id);
    if (!card) return;
    card.addEventListener('click', () => {
      if (state.filters.status === statusValue) {
        state.filters.status = 'TODOS';
        state.activeKpiFilter = null;
      } else {
        state.filters.status = statusValue;
        state.activeKpiFilter = statusValue;
      }
      elements.statusSelect.value = state.filters.status;
      updateKpiCardsHighlight();
      applyFilters();
    });
  }

  function updateKpiCardsHighlight() {
    ['kpi-total', 'kpi-nao-iniciado', 'kpi-em-andamento', 'kpi-processado'].forEach(id => {
      document.getElementById(id)?.classList.remove('active-filter');
    });

    if (state.activeKpiFilter === 'Não iniciado') {
      document.getElementById('kpi-nao-iniciado')?.classList.add('active-filter');
    } else if (state.activeKpiFilter === 'Em andamento') {
      document.getElementById('kpi-em-andamento')?.classList.add('active-filter');
    } else if (state.activeKpiFilter === 'Processado') {
      document.getElementById('kpi-processado')?.classList.add('active-filter');
    }
  }

  function resetFilters() {
    state.filters = { search: '', grupo: 'TODOS', ug: 'TODAS', status: 'TODOS' };
    state.activeKpiFilter = null;
    elements.searchInput.value = '';
    elements.grupoSelect.value = 'TODOS';
    elements.statusSelect.value = 'TODOS';
    filterUgSelectOptions('TODOS');
    updateKpiCardsHighlight();
    applyFilters();
  }

  function applyFilters() {
    state.filteredData = state.allData.filter(item => {
      if (state.filters.search) {
        const term = state.filters.search;
        const matchesUorg = item.uorg_codigo && item.uorg_codigo.toLowerCase().includes(term);
        const matchesSigla = item.uorg_sigla && item.uorg_sigla.toLowerCase().includes(term);
        const matchesProc = item.processo_sei && item.processo_sei.toLowerCase().includes(term);
        const matchesUg = item.ug_sigla && item.ug_sigla.toLowerCase().includes(term);
        if (!matchesUorg && !matchesSigla && !matchesProc && !matchesUg) return false;
      }

      if (state.filters.grupo !== 'TODOS' && item.ug_tipo !== state.filters.grupo) return false;
      if (state.filters.ug !== 'TODAS' && item.ug_sigla !== state.filters.ug) return false;
      if (state.filters.status !== 'TODOS' && item.status_simplificado !== state.filters.status) return false;

      return true;
    });

    renderMetrics();
    renderUgCards();
    renderTable();
  }

  function renderMetrics() {
    const total = state.filteredData.length;
    let naoIniciado = 0, emAndamento = 0, processado = 0;

    state.filteredData.forEach(d => {
      if (d.status_simplificado === 'Não iniciado') naoIniciado++;
      else if (d.status_simplificado === 'Em andamento') emAndamento++;
      else if (d.status_simplificado === 'Processado') processado++;
    });

    const pctNaoIniciado = total > 0 ? ((naoIniciado / total) * 100).toFixed(1) : '0.0';
    const pctEmAndamento = total > 0 ? ((emAndamento / total) * 100).toFixed(1) : '0.0';
    const pctProcessado = total > 0 ? ((processado / total) * 100).toFixed(1) : '0.0';
    const restanteParaProcessar = total - processado;

    elements.kpiTotal.textContent = total;
    elements.kpiNaoIniciadoVal.textContent = naoIniciado;
    elements.kpiNaoIniciadoPct.textContent = `${pctNaoIniciado}%`;

    elements.kpiEmAndamentoVal.textContent = emAndamento;
    elements.kpiEmAndamentoPct.textContent = `${pctEmAndamento}%`;

    elements.kpiProcessadoVal.textContent = processado;
    elements.kpiProcessadoPct.textContent = `${pctProcessado}%`;

    elements.kpiRestaVal.textContent = restanteParaProcessar;
    elements.kpiRestaSubtitle.textContent = `${((restanteParaProcessar / (total || 1)) * 100).toFixed(1)}% do escopo restante`;

    elements.segNaoIniciado.style.width = `${pctNaoIniciado}%`;
    elements.segEmAndamento.style.width = `${pctEmAndamento}%`;
    elements.segProcessado.style.width = `${pctProcessado}%`;

    elements.legNaoIniciado.textContent = `Não iniciado: ${naoIniciado} (${pctNaoIniciado}%)`;
    elements.legEmAndamento.textContent = `Em andamento: ${emAndamento} (${pctEmAndamento}%)`;
    elements.legProcessado.textContent = `Processado: ${processado} (${pctProcessado}%)`;
  }

  function renderUgCards() {
    if (elements.ugGridDiretorias) elements.ugGridDiretorias.innerHTML = '';
    if (elements.ugGridPf) elements.ugGridPf.innerHTML = '';

    const ugGroups = {};
    state.ugs.forEach(ug => {
      ugGroups[ug.sigla] = { meta: ug, total: 0, naoIniciado: 0, emAndamento: 0, processado: 0 };
    });

    let totalUorgsDiretoria = 0;
    let totalUorgsPf = 0;
    let ugsComDadosDiretoria = 0;
    let ugsComDadosPf = 0;

    state.filteredData.forEach(item => {
      if (ugGroups[item.ug_sigla]) {
        ugGroups[item.ug_sigla].total++;
        if (item.status_simplificado === 'Não iniciado') ugGroups[item.ug_sigla].naoIniciado++;
        else if (item.status_simplificado === 'Em andamento') ugGroups[item.ug_sigla].emAndamento++;
        else if (item.status_simplificado === 'Processado') ugGroups[item.ug_sigla].processado++;

        if (item.ug_tipo === 'DIRETORIA') totalUorgsDiretoria++;
        else totalUorgsPf++;
      }
    });

    Object.values(ugGroups).forEach(ug => {
      if (ug.total === 0) return;

      const isDiretoria = ug.meta.tipo === 'DIRETORIA';
      if (isDiretoria) ugsComDadosDiretoria++;
      else ugsComDadosPf++;

      const card = document.createElement('div');
      card.className = `ug-card ${state.filters.ug === ug.meta.sigla ? 'selected' : ''}`;
      const pctEmAnd = ((ug.emAndamento / ug.total) * 100).toFixed(0);
      const pctNaoIni = ((ug.naoIniciado / ug.total) * 100).toFixed(0);
      const pctProc = ((ug.processado / ug.total) * 100).toFixed(0);
      const tipoBadge = isDiretoria ? 'Sede' : 'Penitenciária Federal';

      card.innerHTML = `
        <div class="ug-card-title-row">
          <span class="ug-sigla">${ug.meta.sigla}</span>
          <span class="ug-tipo-pill">${tipoBadge}</span>
        </div>
        <div class="ug-card-name" title="${ug.meta.nome}">${ug.meta.nome}</div>
        <div class="ug-card-metrics">
          <span>Total: <strong>${ug.total}</strong></span>
          <span>Em andamento: <strong style="color: var(--status-em-andamento)">${ug.emAndamento}</strong></span>
          <span>Não iniciado: <strong style="color: var(--status-nao-iniciado)">${ug.naoIniciado}</strong></span>
        </div>
        <div class="progress-bar-multi" style="height: 8px;">
          <div class="progress-segment nao-iniciado" style="width: ${pctNaoIni}%"></div>
          <div class="progress-segment em-andamento" style="width: ${pctEmAnd}%"></div>
          <div class="progress-segment processado" style="width: ${pctProc}%"></div>
        </div>
      `;

      card.addEventListener('click', () => {
        state.filters.ug = (state.filters.ug === ug.meta.sigla) ? 'TODAS' : ug.meta.sigla;
        elements.ugSelect.value = state.filters.ug;
        applyFilters();
      });

      if (isDiretoria && elements.ugGridDiretorias) {
        elements.ugGridDiretorias.appendChild(card);
      } else if (!isDiretoria && elements.ugGridPf) {
        elements.ugGridPf.appendChild(card);
      }
    });

    // Atualiza badges de cabeçalho dos blocos
    if (elements.ugMetaDiretorias) {
      elements.ugMetaDiretorias.textContent = `${ugsComDadosDiretoria} UGs • ${totalUorgsDiretoria} UORGs`;
    }
    if (elements.ugMetaPf) {
      elements.ugMetaPf.textContent = `${ugsComDadosPf} UGs • ${totalUorgsPf} UORGs`;
    }
  }

  function renderTable() {
    elements.tableBody.innerHTML = '';
    elements.tableCount.textContent = `Exibindo ${state.filteredData.length} de ${state.allData.length} UORGs`;

    if (state.filteredData.length === 0) {
      elements.tableBody.innerHTML = `
        <tr>
          <td colspan="8" style="text-align: center; padding: 32px; color: var(--text-muted)">
            Nenhuma UORG encontrada com os filtros selecionados.
          </td>
        </tr>
      `;
      return;
    }

    state.filteredData.forEach(item => {
      const tr = document.createElement('tr');
      const statusClass = item.status_simplificado === 'Processado' ? 'processado' 
                        : (item.status_simplificado === 'Em andamento' ? 'em-andamento' : 'nao-iniciado');

      const procHtml = item.processo_sei ? (
        item.processo_sei_link ? `
          <a href="${item.processo_sei_link}" target="_blank" rel="noopener noreferrer" class="sei-link" title="Abrir no SEI">
            ${item.processo_sei} ↗
          </a>
        ` : `<span class="sei-link" style="text-decoration:none">${item.processo_sei}</span>`
      ) : `<span class="sei-empty">Não autuado</span>`;

      const cautelaHtml = item.bens_acautelados_doc ? `
        <span style="font-size: 12px; color: #166534; font-weight: 500" title="${item.bens_acautelados_doc}">
          ✓ Entregue
        </span>
      ` : `<span class="sei-empty">Pendente</span>`;

      tr.innerHTML = `
        <td style="font-weight: 700; color: var(--primary)">${item.ug_sigla}</td>
        <td style="font-family: var(--font-mono); font-weight: 600">${item.uorg_codigo || '-'}</td>
        <td style="font-weight: 600">${item.uorg_sigla}</td>
        <td>
          <span class="status-pill ${statusClass}">
            <span class="legend-dot ${statusClass}"></span>
            ${item.status_simplificado}
          </span>
        </td>
        <td>${procHtml}</td>
        <td>${cautelaHtml}</td>
        <td>
          <button class="btn-action btn-edit-row" data-id="${item.id}" style="padding: 4px 10px; font-size: 12px">
            ✏️ Editar
          </button>
        </td>
      `;

      tr.querySelector('.btn-edit-row').addEventListener('click', (e) => {
        e.stopPropagation();
        abrirEdicaoNoModuloGestao(item.id);
      });

      tr.addEventListener('click', (e) => {
        if (!e.target.closest('a') && !e.target.closest('button')) {
          openModal(item);
        }
      });

      elements.tableBody.appendChild(tr);
    });
  }

  // ============================================================================
  // MÓDULO DE GESTÃO OPERACIONAL (CONTROLLER FRONTEND)
  // ============================================================================

  function abrirEdicaoNoModuloGestao(id) {
    switchView('gestao');
    elements.gestaoSelectUorg.value = id;
    carregarFormularioGestao(id);
    elements.gestaoForm.scrollIntoView({ behavior: 'smooth' });
  }

  function carregarFormularioGestao(id) {
    const item = state.allData.find(d => d.id === id);
    if (!item) return;

    state.selectedUorgId = id;
    elements.inputFormId.value = item.id;
    elements.inputFormUg.value = `${item.ug_sigla} — ${item.ug_nome}`;
    elements.inputFormCodigo.value = item.uorg_codigo || '';
    elements.inputFormSigla.value = item.uorg_sigla || '';
    elements.inputFormProc.value = item.processo_sei || '';
    elements.inputFormProcLink.value = item.processo_sei_link || '';
    elements.inputFormCautela.value = item.bens_acautelados_doc || '';
    elements.inputFormRelUorg.value = item.relatorio_uorg || '';
    elements.inputFormRelFin.value = item.relatorio_final_ug || '';
    elements.selectFormStatus.value = item.status_simplificado || 'Não iniciado';

    elements.gestaoForm.style.display = 'block';
  }

  function limparFormularioGestao() {
    state.selectedUorgId = null;
    elements.gestaoForm.reset();
    elements.gestaoForm.style.display = 'none';
  }

  function salvarFormularioGestao() {
    const id = parseInt(elements.inputFormId.value, 10);
    if (!id) return;

    const payload = {
      id: id,
      processo_sei: elements.inputFormProc.value.trim(),
      processo_sei_link: elements.inputFormProcLink.value.trim(),
      bens_acautelados_doc: elements.inputFormCautela.value.trim(),
      relatorio_uorg: elements.inputFormRelUorg.value.trim(),
      relatorio_final_ug: elements.inputFormRelFin.value.trim(),
      status_simplificado: elements.selectFormStatus.value
    };

    elements.btnSalvarGestao.disabled = true;
    elements.btnSalvarGestao.textContent = 'Salvando...';

    // Se estiver rodando dentro do Google Apps Script:
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler((res) => {
          elements.btnSalvarGestao.disabled = false;
          elements.btnSalvarGestao.textContent = '💾 Salvar Alterações no Banco';

          if (res && res.status === 'success') {
            atualizarItemNoEstadoLocal(id, payload);
            showToast('✓ UORG atualizada com sucesso na planilha db_inventario!', 'success');
          } else {
            showToast('Erro ao salvar: ' + (res.mensagem || 'Erro desconhecido'), 'error');
          }
        })
        .withFailureHandler((err) => {
          elements.btnSalvarGestao.disabled = false;
          elements.btnSalvarGestao.textContent = '💾 Salvar Alterações no Banco';
          showToast('Erro de comunicação: ' + err.toString(), 'error');
        })
        .salvarUorg(payload);
    } else {
      // Modo local / preview
      setTimeout(() => {
        elements.btnSalvarGestao.disabled = false;
        elements.btnSalvarGestao.textContent = '💾 Salvar Alterações no Banco';
        atualizarItemNoEstadoLocal(id, payload);
        showToast('✓ Alterações salvas com sucesso no banco de dados!', 'success');
      }, 300);
    }
  }

  function atualizarItemNoEstadoLocal(id, payload) {
    const item = state.allData.find(d => d.id === id);
    if (item) {
      Object.assign(item, payload);
      applyFilters();
      populateGestaoUorgSelect();
      elements.gestaoSelectUorg.value = id;
    }
  }

  function showToast(message, type = 'success') {
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    toast.textContent = message;
    elements.toastContainer.appendChild(toast);

    setTimeout(() => toast.classList.add('show'), 10);
    setTimeout(() => {
      toast.classList.remove('show');
      setTimeout(() => toast.remove(), 300);
    }, 4000);
  }

  // Modal
  function openModal(item) {
    elements.modalTitle.textContent = `${item.ug_sigla} — ${item.uorg_sigla}`;
    elements.modalSubtitle.textContent = `Código UORG: ${item.uorg_codigo} | UG: ${item.ug_nome}`;

    const statusClass = item.status_simplificado === 'Processado' ? 'processado' 
                      : (item.status_simplificado === 'Em andamento' ? 'em-andamento' : 'nao-iniciado');

    elements.modalBody.innerHTML = `
      <div class="detail-row">
        <span class="detail-label">Status do Inventário</span>
        <div>
          <span class="status-pill ${statusClass}">
            <span class="legend-dot ${statusClass}"></span>
            ${item.status_simplificado}
          </span>
        </div>
      </div>

      <div class="detail-row">
        <span class="detail-label">Processo SEI do Inventário</span>
        <div class="detail-value">
          ${item.processo_sei ? (
            item.processo_sei_link 
              ? `<a href="${item.processo_sei_link}" target="_blank" class="sei-link" style="font-size:14px">${item.processo_sei} ↗</a>` 
              : item.processo_sei
          ) : 'Nenhum processo autuado'}
        </div>
      </div>

      <div class="detail-row">
        <span class="detail-label">Declaração de Bens Acautelados (Prazo: 31/08/2026)</span>
        <div class="detail-value">
          ${item.bens_acautelados_doc || 'Pendente de envio'}
        </div>
      </div>

      <div class="detail-row">
        <span class="detail-label">Comissão / Designação</span>
        <div class="detail-value" style="white-space: pre-wrap">
          ${item.comissao_designacao || 'Designação sob Portaria Geral da UG'}
        </div>
      </div>

      <div style="margin-top: 20px; display: flex; justify-content: flex-end;">
        <button id="btn-modal-edit" class="btn-action btn-primary">
          ✏️ Abrir no Módulo de Gestão para Edição
        </button>
      </div>
    `;

    document.getElementById('btn-modal-edit').addEventListener('click', () => {
      closeModal();
      abrirEdicaoNoModuloGestao(item.id);
    });

    elements.modalOverlay.classList.add('active');
  }

  function closeModal() {
    elements.modalOverlay.classList.remove('active');
  }

  function exportFilteredCsv() {
    if (state.filteredData.length === 0) return;
    const headers = ['UG', 'Codigo_UORG', 'Sigla_UORG', 'Status', 'Processo_SEI', 'Link_SEI', 'Bens_Acautelados'];
    const rows = state.filteredData.map(d => [
      `"${d.ug_sigla}"`, `"${d.uorg_codigo}"`, `"${d.uorg_sigla}"`, `"${d.status_simplificado}"`,
      `"${d.processo_sei || ''}"`, `"${d.processo_sei_link || ''}"`,
      `"${(d.bens_acautelados_doc || '').replace(/"/g, '""')}"`
    ]);

    const csvContent = '\uFEFF' + [headers.join(';'), ...rows.map(r => r.join(';'))].join('\n');
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `inventario_senappen_filtrado_${new Date().toISOString().slice(0, 10)}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  }

  // Inicializa a aplicação
  init();
});

</script>
